name: Build Calendar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p build-source
          unzip -q calendar-apk-github-build.zip -d build-source

          echo "Extracted files:"
          find build-source -maxdepth 3 -type f | head -100

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build-source" -name "settings.gradle.kts" -o -name "settings.gradle" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate signing key
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias calendar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass calendar123 \
            -keypass calendar123 \
            -dname "CN=Calendar App, O=Personal"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SIGNING_KEY_ALIAS: calendar
          SIGNING_KEY_PASSWORD: calendar123
          SIGNING_STORE_FILE: release.keystore
          SIGNING_STORE_PASSWORD: calendar123
        run: |
          chmod +x gradlew
          ./gradlew assembleCoreRelease --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calendar-core-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/**/*.apk
          if-no-files-found: error
